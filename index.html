<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dom 10 Marmitaria - Cardápio Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <style>
    :root {
      --cor-destaque: #e53935;
      --cor-destaque-hover: #c62828;
      --cor-fundo: #faf8f5;
      --cor-card: #ffffff;
      --cor-texto: #1a1a1a;
      --cor-suave: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.cliente {
      background-color: var(--cor-fundo);
      font-family: 'Figtree', sans-serif;
      color: var(--cor-texto);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* BARRA SUPERIOR DE CONTATO */
    .topo-contato {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 8px 15px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .topo-contato a {
      color: #4caf50;
      text-decoration: none;
      margin: 0 5px;
    }

    /* HERO BANNER */
    .hero-container {
      max-width: 1100px;
      margin: 30px auto 20px;
      padding: 0 20px;
    }

    .hero-card {
      background: var(--cor-card);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      align-items: center;
    }

    @media (max-width: 768px) {
      .hero-card {
        grid-template-columns: 1fr;
      }
    }

    .hero-texto {
      padding: 50px 40px;
    }

    .hero-tag {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--cor-destaque);
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero-titulo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 2.8rem;
      line-height: 1.1;
      color: #111;
      margin-bottom: 15px;
    }

    .hero-subtitulo {
      font-size: 1.1rem;
      color: var(--cor-suave);
      margin-bottom: 30px;
    }

    .btn-hero {
      display: inline-block;
      background-color: var(--cor-destaque);
      color: #fff;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(229, 57, 53, 0.3);
    }

    .btn-hero:hover {
      background-color: var(--cor-destaque-hover);
      transform: translateY(-2px);
    }

    .hero-imagem {
      width: 100%;
      height: 100%;
      min-height: 380px;
      object-fit: cover;
      display: block;
    }

    /* CARDÁPIO SEÇÃO */
    .wrap-cardapio {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .titulo-secao {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 2rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .titulo-secao::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 32px;
      background-color: var(--cor-destaque);
      border-radius: 4px;
    }

    /* BOTÃO FLUTUANTE DO WHATSAPP (CANTO INFERIOR DIREITO) */
    .btn-whatsapp-flutuante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      z-index: 999;
      transition: transform 0.2s ease;
    }

    .btn-whatsapp-flutuante:hover {
      transform: scale(1.05);
      background-color: #20ba5a;
    }

    /* CARRINHO FLUTUANTE (CANTO INFERIOR ESQUERDO / CENTRALIZADO) */
    .carrinho-painel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      max-width: 360px;
      width: calc(100% - 100px);
      background: #ffffff;
      border-radius: 16px;
      padding: 15px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      border: 2px solid #e53935;
      z-index: 998;
    }
  </style>
</head>
<body class="cliente">

  <!-- Faixa de Contato no Topo -->
  <div class="topo-contato">
    <span>🍱 Dom 10 Marmitaria — Faça seu pedido:</span>
    <a href="https://wa.me/5511969429812" target="_blank">(11) 96942-9812</a> | 
    <a href="https://wa.me/5511994196063" target="_blank">(11) 99419-6063</a>
  </div>

  <!-- Hero Section -->
  <header class="hero-container">
    <div class="hero-card">
      <div class="hero-texto">
        <span class="hero-tag">Dom 10 Marmitaria</span>
        <h1 class="hero-titulo">Sabor caseiro feito para você.</h1>
        <p class="hero-subtitulo">Comida de verdade, ingredientes selecionados e entrega rápida todos os dias.</p>
        <a href="#cardapio" class="btn-hero">Ver Cardápio</a>
      </div>
      <div>
        <img src="fachada.jpg" alt="Dom 10 Marmitaria Fachada" class="hero-imagem" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80'">
      </div>
    </div>
  </header>

  <!-- Seção do Cardápio -->
  <main class="wrap-cardapio" id="cardapio">
    <h2 class="titulo-secao">Cardápio do Dia</h2>
    <div id="categorias-container"></div>
    <div id="produtos-container" class="produtos-grid"></div>

    <!-- Carrinho Flutuante / Resumo do Pedido -->
    <aside class="carrinho-painel" id="carrinho" hidden>
      <h3 style="margin-bottom: 8px;">🛒 Seu Pedido</h3>
      <div id="itens-carrinho"></div>
      <div class="resumo-carrinho" style="margin-top: 10px;">
        <p>Total: <strong id="total-carrinho">R$ 0,00</strong></p>
        <button class="btn" id="btn-finalizar" style="width: 100%; margin-top: 8px; background: #25d366; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">Finalizar Pedido no WhatsApp</button>
      </div>
    </aside>
  </main>

  <!-- Botão Flutuante do WhatsApp no canto -->
  <a href="https://wa.me/5511969429812" class="btn-whatsapp-flutuante" target="_blank">
    <span>💬 WhatsApp</span>
  </a>

  <script type="module" src="app.js"></script>
</body>
</html>
