<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="hero"><div class="wrap">
  <h1 id="nome-loja"></h1><p id="slogan"></p>
  <div class="infos" id="infos"></div>
</div></header>
<nav aria-label="Categorias"><div class="wrap" id="categorias"></div></nav>
<main class="wrap"><div class="grade" id="grade"></div></main>
<footer><div class="wrap" id="rodape"></div></footer>

<div id="barra"><button id="abrir" disabled><span id="qtd-total"></span><span id="valor-total"></span></button></div>
<div id="gaveta" aria-hidden="true">
  <aside id="painel-pedido" role="dialog" aria-label="Seu pedido">
    <button class="fechar" id="fechar" aria-label="Fechar">×</button>
    <h2>Seu pedido</h2>
    <div id="itens"></div>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <label>Seu nome <input id="f-nome" autocomplete="name"></label>
    <label>Como vai receber?
      <select id="f-tipo"><option value="entrega">Entrega</option><option value="retirada">Retirar na loja</option></select></label>
    <label id="l-endereco">Endereço de entrega <input id="f-endereco" autocomplete="street-address"></label>
    <label>Pagamento
      <select id="f-pagto"><option>Pix</option><option>Cartão na entrega</option><option>Dinheiro</option></select></label>
    <label>Observações <textarea id="f-obs" rows="2" placeholder="Ex.: sem cebola"></textarea></label>
    <p class="erro" id="erro" role="alert"></p>
    <button class="enviar" id="enviar">Enviar pedido pelo WhatsApp</button>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
